apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  labels:
    app: animal-api
data:
  spring-datasource-url: jdbc:mysql://mysql:3306/mydatabase # mysql:3306 -> mysql: mysql-service internal service name. (internal DNS) Internal service by default ClusterIp
  spring-application-name: demo
  server-port: "8084"
  spring-jpa-hibernate-ddl-auto: update
  spring-jpa-show-sql: "true"